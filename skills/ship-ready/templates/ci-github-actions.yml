# Quality gate for a Python project. Adapt the setup and tool steps for other stacks.
# Supply-chain hardening (OpenSSF Scorecard): actions pinned by full commit SHA,
# least-privilege token, no persisted credentials. Update pins with Dependabot or Renovate.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # full history for secret scanning
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"   # dev extras pin ruff, mypy, pytest, pytest-cov, bandit, pip-audit, radon

      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy --strict src
      - name: Complexity (fails on any function graded C or worse)
        run: test -z "$(radon cc -s -n C src)"
      - name: Tests + coverage
        run: pytest --cov=src --cov-branch --cov-report=xml --cov-fail-under=80
      - name: Security (SAST)
        run: bandit -q -r src -ll
      - name: Dependency audit
        run: pip-audit

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mutation:
    # Slower: mutation-test only the files changed in this PR.
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" mutmut
      - name: Mutation test changed modules
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF"...HEAD -- 'src/**/*.py' | paste -sd, -)
          if [ -z "$changed" ]; then echo "No changed source files"; exit 0; fi
          mutmut run --paths-to-mutate "$changed"
          mutmut results
